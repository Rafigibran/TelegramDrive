name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.0.12433566'
          accept-android-sdk-licenses: true

      - name: Configure Android environment
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.0.12433566" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/28.0.12433566" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$SDK_ROOT/ndk/28.0.12433566" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Initialize Tauri Android project
        working-directory: app
        run: npm run tauri android init -- --ci

      - name: Prepare Android native integrations
        working-directory: app
        run: npm run android:prepare

      - name: Build Android APK
        working-directory: app
        run: npm run tauri android build -- --apk=true --target aarch64

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/src-tauri/gen/android/app/build/outputs -type f -name "*.apk" | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::APK was not produced"
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "--- APK found ---"
          ls -lh "$APK"

      - name: Create GitHub Release and upload APK
        uses: actions/github-script@v7
        env:
          APK_PATH: ${{ env.APK }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const apkPath = process.env.APK_PATH;
            if (!apkPath || !fs.existsSync(apkPath)) {
              core.setFailed("APK not found: " + apkPath);
              return;
            }

            const tauriConfig = JSON.parse(
              fs.readFileSync("app/src-tauri/tauri.conf.json", "utf8")
            );

            const version = tauriConfig.version || "unknown";
            const runNumber = process.env.GITHUB_RUN_NUMBER;
            const runAttempt = process.env.GITHUB_RUN_ATTEMPT;
            const tag = "android-v" + version + "-build-" + runNumber + "-" + runAttempt;
            const releaseName = "Telegram Drive Android v" + version + " — Build #" + runNumber;
            const apkName = "Telegram-Drive-Android-v" + version + "-build-" + runNumber + ".apk";

            const releaseBody = [
              "## Telegram Drive Android",
              "",
              "Version: " + version,
              "Build: #" + runNumber,
              "Commit: " + context.sha,
              "",
              "APK generated automatically after a successful Android build."
            ].join("\n");

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: releaseName,
              body: releaseBody,
              draft: false,
              prerelease: false
            });

            const apkData = fs.readFileSync(apkPath);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: apkName,
              data: apkData,
              headers: {
                "content-type": "application/vnd.android.package-archive",
                "content-length": apkData.length
              }
            });

            core.info("Release created: " + release.html_url);
            core.info("APK uploaded: " + apkName);
