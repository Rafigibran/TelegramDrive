name: Android CI

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.0.12433566'
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.0.12433566" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/28.0.12433566" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$SDK_ROOT/ndk/28.0.12433566" >> "$GITHUB_ENV"
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.0.12433566"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Validate TypeScript and frontend build
        working-directory: app
        run: npm run build

      - name: Initialize Tauri Android project
        working-directory: app
        run: npm run tauri android init -- --ci

      - name: Prepare Android native integrations
        working-directory: app
        run: npm run android:prepare

      - name: Build Android arm64 APK and AAB
        working-directory: app
        run: npm run tauri android build -- --apk=true --aab=true --target aarch64

      - name: Verify Android bundles
        shell: bash
        run: |
          set -euo pipefail
          find app/src-tauri/gen/android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print
          test -n "$(find app/src-tauri/gen/android/app/build/outputs -type f -name '*.apk' -print -quit)"
          test -n "$(find app/src-tauri/gen/android/app/build/outputs -type f -name '*.aab' -print -quit)"
