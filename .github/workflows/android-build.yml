name: Android Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.0.12433566'
          accept-android-sdk-licenses: true

      - name: Install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.12433566" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Initialize Tauri Android project
        working-directory: app
        run: npm run tauri android init -- --ci

      - name: Prepare Android native integrations
        working-directory: app
        run: npm run android:prepare

      - name: Build arm64 APK
        working-directory: app
        run: npm run tauri android build -- --apk=true --aab=true --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-drive-android-arm64
          path: app/src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: telegram-drive-android-aab
          path: app/src-tauri/gen/android/app/build/outputs/**/*.aab
          if-no-files-found: warn
